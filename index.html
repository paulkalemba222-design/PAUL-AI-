<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>PAUL AI</title><script src="config.js"></script><style>
:root{color-scheme:dark;--bg:#07111f;--blue:#3187ff;--text:#f4f7ff;--muted:#9aacc5}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#12294a,var(--bg) 48%);color:var(--text);font:16px system-ui,Arial;min-height:100vh}header{padding:22px 18px 14px;display:flex;gap:12px;align-items:center;position:sticky;top:0;background:#07111fee} .logo{width:48px;height:48px;border-radius:16px;background:linear-gradient(145deg,#59a5ff,#1455d9);display:grid;place-items:center;font-size:27px}h1{font-size:22px;margin:0}small,.muted{color:var(--muted)}main{max-width:760px;margin:auto;padding:0 14px 18px}.card{background:#0e1a2bd9;border:1px solid #263b58;border-radius:20px;padding:16px;margin:12px 0}input,textarea{width:100%;background:#071321;border:1px solid #2b4261;border-radius:12px;padding:13px;color:white;font:inherit;margin:6px 0}button{background:var(--blue);color:white;border:0;border-radius:12px;padding:12px 16px;font:600 15px system-ui}button.secondary{background:#1b2e49}button:disabled{opacity:.55}.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}#messages{height:42vh;min-height:240px;overflow:auto;display:flex;flex-direction:column;gap:10px}.msg{white-space:pre-wrap;overflow-wrap:anywhere;max-width:90%;padding:12px 14px;border-radius:16px;line-height:1.45}.user{align-self:flex-end;background:#1d63c9}.ai{align-self:flex-start;background:#172941;border:1px solid #294260}#status{font-size:13px;color:#8eb9ff}footer{position:sticky;bottom:0;background:#07111ff2;padding:10px 0}.hidden{display:none!important}.brand{color:#78b5ff}</style></head><body>
<header><div class="logo">🦁</div><div><h1>PAUL <span class="brand">AI</span></h1><small>Ton pote intelligent. Zéro ambiance robot. 😂</small></div></header><main>
<section class="card" id="auth"><h2>Entre dans la tanière 👑</h2><p class="muted">Connecte-toi avec ton compte Supabase.</p><input id="email" type="email" autocomplete="email" placeholder="Adresse e-mail"><input id="password" type="password" autocomplete="current-password" placeholder="Mot de passe"><div class="row"><button id="login">Connexion</button><button class="secondary" id="signup">Créer un compte</button></div><p id="authstatus" class="muted"></p></section>
<section class="card hidden" id="chatcard"><div class="row" style="align-items:center"><div><b>🔥 Mix explosif</b><div id="status">Connecté</div></div><button class="secondary" id="logout" style="flex:0 0 auto">Déconnexion</button></div><div id="messages" aria-live="polite"></div><footer><textarea id="prompt" rows="2" maxlength="6000" placeholder="Balance ta question, man…"></textarea><div class="row"><button id="send">Envoyer 🔥</button><button id="clear" class="secondary">Effacer</button></div></footer></section><p class="muted" style="text-align:center;font-size:12px">PAUL AI • Version de départ • Internet requis</p></main>
<script>
const cfg=window.PAUL_CONFIG||{};const $=id=>document.getElementById(id);let token="",history=[];function status(t){$("authstatus").textContent=t}function showChat(on){$("auth").classList.toggle("hidden",on);$("chatcard").classList.toggle("hidden",!on)}function addMsg(text,who){const d=document.createElement("div");d.className="msg "+who;d.textContent=text;$("messages").appendChild(d);$("messages").scrollTop=$("messages").scrollHeight}
async function authRequest(path,body){const r=await fetch(cfg.SUPABASE_URL+"/auth/v1/"+path,{method:"POST",headers:{"Content-Type":"application/json","apikey":cfg.SUPABASE_ANON_KEY},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw Error(d.msg||d.message||d.error_description||"Connexion impossible");return d}
$("login").onclick=async()=>{try{status("Connexion…");if(!cfg.SUPABASE_ANON_KEY||cfg.SUPABASE_ANON_KEY.startsWith("REMPLACE"))throw Error("Ajoute la clé publique Supabase dans config.js.");const d=await authRequest("token?grant_type=password",{email:$("email").value.trim(),password:$("password").value});token=d.access_token;showChat(true);status("");addMsg("WEEEH 😂🔥 Tu es dans la tanière ! Pose ta question, on va voir ce que tu as dans le ventre.","ai")}catch(e){status(e.message)}};
$("signup").onclick=async()=>{try{status("Création du compte…");if(!cfg.SUPABASE_ANON_KEY||cfg.SUPABASE_ANON_KEY.startsWith("REMPLACE"))throw Error("Ajoute la clé publique Supabase dans config.js.");const d=await authRequest("signup",{email:$("email").value.trim(),password:$("password").value});if(d.access_token){token=d.access_token;showChat(true);status("")}else status("Compte créé. Vérifie ton e-mail si nécessaire, puis connecte-toi.")}catch(e){status(e.message)}};
$("send").onclick=async()=>{const message=$("prompt").value.trim();if(!message||!token)return;$("prompt").value="";addMsg(message,"user");$("send").disabled=true;$("status").textContent="PAUL réfléchit…";try{const r=await fetch(cfg.SUPABASE_URL+"/functions/v1/paul-ai",{method:"POST",headers:{"Content-Type":"application/json","apikey":cfg.SUPABASE_ANON_KEY,"Authorization":"Bearer "+token},body:JSON.stringify({message,history:history.slice(-8)})});const d=await r.json();if(!r.ok)throw Error(d.error||"Erreur serveur");const answer=d.answer||"J'ai reçu du vide, man 😭 Réessaie.";addMsg(answer,"ai");history.push({role:"user",content:message},{role:"assistant",content:answer});history=history.slice(-10)}catch(e){addMsg("Oups 😅 "+e.message,"ai")}finally{$("send").disabled=false;$("status").textContent="Connecté"}};
$("prompt").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();$("send").click()}});$("clear").onclick=()=>{$("messages").replaceChildren();history=[]};$("logout").onclick=()=>{token="";history=[];$("messages").replaceChildren();showChat(false)};
</script></body></html>
