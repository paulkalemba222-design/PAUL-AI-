<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1220"><title>PAUL AI</title><style>
*{box-sizing:border-box}body{margin:0;height:100dvh;display:flex;flex-direction:column;background:radial-gradient(ellipse at top,#172c4b,#0b1220 55%);color:#eef4ff;font-family:system-ui,sans-serif}header{padding:18px;border-bottom:1px solid #25344b;display:flex;align-items:center;gap:12px}.logo{height:45px;width:45px;border-radius:15px;background:linear-gradient(135deg,#3b82f6,#164eaa);display:grid;place-items:center;font-size:24px;font-weight:bold}h1{font-size:19px;margin:0}small{color:#9fb1ca}.tag{margin-left:auto;color:#93c5fd;border:1px solid #2e527d;padding:5px 8px;border-radius:20px;font-size:11px}#messages{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px}.welcome{margin:auto;text-align:center;max-width:300px;color:#b7c6dc}.spark{font-size:38px;color:#60a5fa}.bubble{max-width:88%;white-space:pre-wrap;overflow-wrap:anywhere;padding:12px 14px;border-radius:17px;line-height:1.45}.user{align-self:flex-end;background:#2563eb}.ai{align-self:flex-start;background:#172438;border:1px solid #2a3c55}.composer{padding:12px max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom));border-top:1px solid #25344b}.tools{display:flex;gap:7px;margin-bottom:9px;flex-wrap:wrap}.tool{border:1px solid #34445b;border-radius:20px;padding:8px 11px;color:#c5d7f0;background:#101c2d}.entry{display:flex;gap:8px;background:#152238;border:1px solid #34465f;border-radius:22px;padding:7px}.entry textarea{resize:none;max-height:120px;min-height:42px;flex:1;background:transparent;color:white;border:0;outline:0;padding:11px 6px;font:inherit}.send{width:43px;border:0;border-radius:16px;background:#3b82f6;color:white;font-size:20px}.hint{text-align:center;font-size:10px;color:#70839d;margin-top:8px}button{cursor:pointer}
</style></head><body><header><div class="logo">P</div><div><h1>PAUL AI</h1><small>Ton assistant intelligent</small></div><span class="tag">BÊTA</span></header><main id="messages"><div class="welcome" id="welcome"><div class="spark">✦</div><h2>Salut, je suis PAUL AI.</h2><p>Pose une question, demande une traduction ou joins un fichier.</p></div></main><section class="composer"><div class="tools"><button class="tool" onclick="document.getElementById('file').click()">＋ Fichier</button><button class="tool" onclick="voice()">🎙 Parler</button><button class="tool" onclick="clearChat()">Nouvelle discussion</button><input id="file" type="file" hidden accept=".txt,.md,.csv,.json,.pdf,.png,.jpg,.jpeg" onchange="filePicked(this.files[0])"></div><div class="entry"><textarea id="prompt" placeholder="Écris à PAUL AI…" rows="1"></textarea><button class="send" onclick="send()">↑</button></div><div class="hint">Ne partage pas de mots de passe ni de clés secrètes.</div></section><script>
const URL_API="https://agiezrhpcdmhgxwqsbmb.supabase.co/functions/v1/paul-ai", API_KEY="sb_publishable_Ah6ASbrliu_sUySSisogIQ_lX8nJzlE";
let history=[],file=null;const box=document.getElementById('messages'),input=document.getElementById('prompt');
function bubble(t,c){document.getElementById('welcome')?.remove();let e=document.createElement('div');e.className='bubble '+c;e.textContent=t;box.appendChild(e);box.scrollTop=box.scrollHeight;return e}
function clearChat(){history=[];box.innerHTML='<div class="welcome" id="welcome"><div class="spark">✦</div><h2>Nouvelle discussion</h2></div>'}
function filePicked(f){file=f||null;if(f)bubble('Fichier sélectionné : '+f.name,'ai')}
async function send(){let m=input.value.trim();if(file){m+='\nFichier : '+file.name;if(/\.(txt|md|csv|json)$/i.test(file.name))m+='\n'+(await file.text()).slice(0,10000);else m+='\nLe PDF ou l’image est sélectionné, mais leur analyse réelle sera ajoutée dans une prochaine version.'}if(!m)return;input.value='';bubble(m,'user');let w=bubble('PAUL AI réfléchit…','ai');try{let r=await fetch(URL_API,{method:'POST',headers:{'Content-Type':'application/json','apikey':API_KEY},body:JSON.stringify({message:m,history})});let d=await r.json();if(!r.ok)throw Error(d.error||'Erreur '+r.status);w.textContent=d.answer||'Pas de réponse';history.push({role:'user',content:m},{role:'assistant',content:w.textContent});history=history.slice(-10)}catch(e){w.textContent='Connexion impossible : '+e.message+'. Si la fonction exige une session Supabase, il faudra ajouter la connexion utilisateur.'}file=null;document.getElementById('file').value=''}
function voice(){if(window.PaulNative){PaulNative.startVoiceInput();return}bubble('La voix est disponible dans l’application Android.','ai')}
window.onPaulSpeechResult=t=>{if(t)input.value+=(input.value?' ':'')+t};input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
</script></body></html>
