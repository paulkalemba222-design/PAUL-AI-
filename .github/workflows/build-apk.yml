
name: Build PAUL AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger le code
        uses: actions/checkout@v4

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compiler PAUL AI
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            echo "ERREUR : le fichier gradlew est absent."
            exit 1
          fi

      - name: Publier l'APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PAUL-AI-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
